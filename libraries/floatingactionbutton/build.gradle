apply plugin: 'com.android.library'

android {
    namespace 'com.github.clans.fab'
    compileSdk Build.compile_sdk_version
    buildToolsVersion Build.build_tools_version

    defaultConfig {
        minSdk Build.min_sdk_version
        targetSdk Build.target_sdk_version
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }
}

dependencies {
    // Java 専用モジュールの計測テストでも、推移的な標準ライブラリの世代をそろえる。
    androidTestImplementation platform("org.jetbrains.kotlin:kotlin-bom:${Versions.kotlin}")
    implementation AndroidX.appcompat
    implementation AndroidX.design
}
