apply plugin: 'com.android.library'

android {
    namespace 'io.github.ajichama.citrusbrowser.engine'
    compileSdk Build.compile_sdk_version
    defaultConfig { minSdk Build.min_sdk_version }
    testOptions { targetSdk = Build.target_sdk_version }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
