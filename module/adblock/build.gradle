apply plugin: 'com.android.library'
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'kotlin-parcelize'
apply plugin: 'com.android.legacy-kapt'
apply plugin: 'dagger.hilt.android.plugin'

android {
    namespace 'io.github.ajichama.citrusbrowser.adblock'
    compileSdk Build.compile_sdk_version
    buildToolsVersion Build.build_tools_version

    defaultConfig {
        minSdk Build.min_sdk_version

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    testOptions {
        targetSdk = Build.target_sdk_version
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    buildFeatures {
        dataBinding true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation Libs.junit
    testImplementation Libs.assertk
    androidTestImplementation Libs.espressoCore
    androidTestImplementation Libs.androidTestCore
    androidTestImplementation Libs.androidRunner
    testImplementation Libs.mockito

    implementation AndroidX.appcompat
    implementation AndroidX.recyclerView
    implementation AndroidX.design
    implementation AndroidX.constraintLayout
    implementation AndroidX.activty
    implementation AndroidX.KTX
    implementation AndroidX.room
    implementation AndroidX.roomKtx
    implementation AndroidX.fix_preference
    implementation AndroidX.fragmentKtx
    ksp AndroidX.roomCompiler

    implementation Libs.kotlin_stdlib
    implementation Libs.kotlin_coroutines
    implementation Libs.kotlin_coroutines_android

    implementation Dagger.hilt
    ksp Dagger.hiltCompiler

    implementation project(':module:core')
    implementation project(':module:ui')
    implementation project(':languages')
    implementation project(':libraries:floatingactionbutton')

    // XML で TouchScrollBar と msb_* 属性を直接使うため、このモジュール自身にも宣言する。
    implementation Libs.materialScrollBar

    implementation Libs.re2j
    implementation Libs.okhttp
}
