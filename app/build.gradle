apply plugin: 'com.android.application'
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'com.android.legacy-kapt'
apply plugin: 'dagger.hilt.android.plugin'

// 公開Android Components APIでvariantの生成assetsを登録する。
// 通常ビルドは固定通知だけを読み、更新候補の取得は明示タスクに限定する。
def checkAllOss = tasks.register('checkOssNotices')
def updateAllOss = tasks.register('updateOssNotices')
androidComponents {
    onVariants(selector().all()) { variant ->
        def variantTitle = variant.name.capitalize()
        def runtime = variant.runtimeConfiguration
        // プロジェクトの資産はソース由来通知へ分離し、AGPの副次artifactを無指定選択しない。
        def externalArtifacts = runtime.incoming.artifactView {
            componentFilter { it instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
        }.artifacts
        def notices = tasks.register("generate${variantTitle}OssNotices", GenerateOssNotices) {
            runtimeComponents.set(externalArtifacts.resolvedArtifacts.map { OssRuntimeGraph.coordinates(it) })
            inputRoot.set(layout.projectDirectory)
            fixedInputs.from(fileTree('oss'), fileTree('html/license'))
            outputDirectory.set(layout.buildDirectory.dir("generated/oss/${variant.name}/assets"))
            reportDirectory.set(layout.buildDirectory.dir("reports/oss/${variant.name}"))
        }
        variant.sources.assets?.addGeneratedSourceDirectory(notices, { it.outputDirectory })
        def checkNotices = tasks.register("check${variantTitle}OssNotices", CheckOssNotices) {
            reports.from(notices.flatMap { it.reportDirectory.file('missing.txt') })
        }
        def updateNotices = tasks.register("update${variantTitle}OssNotices", UpdateOssNotices) {
            runtimeArtifacts = externalArtifacts
            dependencies = project.dependencies
            offline.set(gradle.startParameter.offline)
            outputDirectory.set(layout.buildDirectory.dir("oss-review/${variant.name}"))
        }
        checkAllOss.configure { dependsOn(checkNotices) }
        updateAllOss.configure { dependsOn(updateNotices) }
    }
}

def gitHash = 'git rev-parse --short HEAD'.execute([], project.rootDir).text.trim()
def buildTime = new Date().format("yyyy-MM-dd'T'HH:mm:ssXXX")

android {
    namespace 'io.github.ajichama.citrusbrowser'
    compileSdk Build.compile_sdk_version
    buildToolsVersion Build.build_tools_version

    defaultConfig {
        applicationId "io.github.ajichama.citrusbrowser"
        minSdk Build.min_sdk_version
        targetSdk Build.target_sdk_version
        versionCode AppVersions.version_code
        versionName AppVersions.version_name
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "GIT_HASH", "\"${gitHash}\""
        buildConfigField "String", "BUILD_TIME", "\"${buildTime}\""
        resValue "string", "package_name", applicationId
        resValue "string", "package_build", gitHash
        resValue "string", "package_build_time", buildTime
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // リリース署名の鍵は、Docker の専用ボリューム（citrus-release-key、/release-key に読み取り専用でつなぐ）に置く。
    // 鍵と設定はソースに置かない。鍵がなければ署名なしで出力する。
    def releaseKeyProperties = new File(System.getenv('CITRUS_RELEASE_KEY_DIR') ?: '/release-key', 'release.properties')
    if (releaseKeyProperties.isFile()) {
        def releaseKey = new Properties()
        releaseKeyProperties.withInputStream { releaseKey.load(it) }
        signingConfigs {
            release {
                storeFile new File(releaseKeyProperties.parentFile, releaseKey.getProperty('storeFile'))
                storePassword releaseKey.getProperty('storePassword')
                keyAlias releaseKey.getProperty('keyAlias')
                keyPassword releaseKey.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            if (releaseKeyProperties.isFile()) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            lint {
                disable 'MissingTranslation', 'GoogleAppIndexingWarning', 'ClickableViewAccessibility'
            }
        }
        debug {
            applicationIdSuffix ".debug"
            resValue "string", "package_name", "${defaultConfig.applicationId}.debug"
        }
    }
    packaging {
        resources {
            excludes += ['META-INF/LICENSE', 'META-INF/CHANGES', 'META-INF/README.md']
        }
    }

    buildFeatures {
        dataBinding true
        buildConfig true
        resValues true
    }
}

repositories {
    maven { url 'https://jitpack.io' }
    mavenCentral()
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation Libs.junit
    androidTestImplementation Libs.espressoCore
    androidTestImplementation Libs.androidRunner
    androidTestImplementation AndroidX.workRuntime
    androidTestImplementation Libs.kotlin_coroutines

    implementation Libs.moshi
    implementation Libs.okhttp

    implementation AndroidX.appcompat
    implementation AndroidX.fix_preference
    implementation AndroidX.room
    implementation AndroidX.documentFile
    implementation AndroidX.design
    implementation project(':libraries:asyncpermissions')
    implementation project(':browser')
    implementation project(':module:ui')
    implementation project(':legacy')
    implementation project(':module:core')
    implementation project(':module:webview')
    implementation project(':languages')
    implementation project(':module:favicon')
    implementation project(':module:download')
    implementation project(':module:adblock')
    implementation project(':module:bookmark')
    implementation project(':module:history')
    implementation project(':module:search')

    implementation Libs.kotlin_stdlib

    implementation Dagger.hilt
    ksp Dagger.hiltCompiler
}
