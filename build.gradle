// プロジェクト全体のルートビルド設定
apply plugin: 'com.github.ben-manes.versions'

buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
        maven { url 'https://jitpack.io' }
    }
    dependencies {
        classpath "com.android.tools.build:gradle:${Versions.agp}"
        // legacy-kapt は AGP 本体と別の実装を持つため、同じ版の公式マーカーを解決する。
        classpath "com.android.legacy-kapt:com.android.legacy-kapt.gradle.plugin:${Versions.agp}"
        // built-in Kotlin の実行依存を、公式対応表内の KGP へ引き上げる。
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${Versions.kotlin}"
        classpath "com.google.devtools.ksp:symbol-processing-gradle-plugin:${Versions.ksp}"
        classpath Dagger.hiltPlugin
        classpath 'com.github.ben-manes:gradle-versions-plugin:0.54.0'
    }
}

static def isNonStable(v) {
    ["-alpha", "-beta", "-rc", "-m"].any { v.toLowerCase().contains(it) }
}

tasks.named("dependencyUpdates").configure {
    rejectVersionIf {
        isNonStable(it.candidate.version) && !isNonStable(it.currentVersion)
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
