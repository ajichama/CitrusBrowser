# ==========================================
# CitrusBrowser Gradle 設定 (gradle.properties)
# ==========================================

# JVM メモリ割当および並列ビルド設定
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true

# Kotlin の永続データも Docker Volume へ隔離し、作業フォルダに .kotlin を作らない。
kotlin.project.persistent.dir=/build-cache/root/.kotlin
kotlin.project.persistent.dir.gradle.disableWrite=true

# AndroidX 利用および互換設定
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=false
